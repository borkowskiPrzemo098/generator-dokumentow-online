<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator zaproszenia na wydarzenie / urodziny — PDF</title>
<meta name="description" content="Darmowy generator eleganckiego zaproszenia na urodziny, wesele lub wydarzenie firmowe. Wypełnij dane i pobierz gotowe zaproszenie w PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<style>#paper .invite-card{ background:var(--inv-bg,#16342c); color:#fff; }
#paper .ic-eyebrow{ color:var(--inv-accent,#cfe8de); }
#paper .ic-line{ background:var(--inv-accent,#cfe8de); }
</style>
</head>
<body>
<header class="site-header"><div class="wrap bar">
  <a href="../index.html" class="brand"><span class="mark">G</span>Generator dokumentów</a>
  <nav class="nav-links"><a href="../index.html#dokumenty">Wszystkie dokumenty</a><a href="../index.html#faq">FAQ</a></nav>
  <a href="../index.html#dokumenty" class="nav-cta">Inne generatory</a>
</div></header>

<div class="wrap crumbs"><a href="../index.html">Strona główna</a><span>/</span><a href="../index.html#dokumenty">Dokumenty</a><span>/</span>Zaproszenie</div>

<div class="wrap gen-head">
  <span class="tag">Okolicznościowe</span>
  <h1>Generator zaproszenia</h1>
  <p>Eleganckie zaproszenie na urodziny, wesele lub wydarzenie firmowe — gotowe do druku w formacie A4.</p>
</div>

<div class="wrap gen-layout">
  <div class="panel">
    <h2>Kolorystyka</h2>
    <div class="swatch-row" id="theme-picker">
      <span class="swatch active" data-color="#16342c" style="background:#16342c"></span>
      <span class="swatch" data-color="#7a2a3a" style="background:#7a2a3a"></span>
      <span class="swatch" data-color="#1f3a5f" style="background:#1f3a5f"></span>
      <span class="swatch" data-color="#7a5c1f" style="background:#7a5c1f"></span>
      <span class="swatch" data-color="#3a3a3a" style="background:#3a3a3a"></span>
    </div>

    <h2 style="margin-top:22px">Treść</h2>
    <div class="field"><label>Nagłówek (mały)</label><input id="f-eyebrow" value="Zapraszamy na"></div>
    <div class="field"><label>Tytuł</label><input id="f-title" value="40. urodziny Anny"></div>
    <div class="field"><label>Treść zaproszenia</label><textarea id="f-body">Będzie nam niezmiernie miło gościć Cię na naszym przyjęciu z tej wyjątkowej okazji.</textarea></div>
    <div class="field"><label>Data i godzina</label><input id="f-date" value="12 lipca 2026, godz. 18:00"></div>
    <div class="field"><label>Miejsce</label><input id="f-place" value="Sala Bankietowa Rezydencja, ul. Parkowa 4, Warszawa"></div>
    <div class="field"><label>Od kogo</label><input id="f-from" value="Anna i rodzina"></div>

    <button class="btn-primary" id="downloadBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
      Pobierz jako PDF
    </button>
  </div>

  <div class="preview-wrap">
    <div class="preview-toolbar"><span class="lbl">Podgląd na żywo</span><div class="zoom-controls"><button type="button" data-zoom="-1">−</button><button type="button" data-zoom="1">+</button></div></div>
    <div class="preview-stage">
      <div class="paper-doc invite-doc" id="paper" style="transform:scale(.5)">
        <div class="invite-card">
          <div class="ic-eyebrow" id="p-eyebrow"></div>
          <div class="ic-line"></div>
          <div class="ic-title" id="p-title"></div>
          <div class="ic-body" id="p-body"></div>
          <div class="ic-details">
            <div id="p-date"></div>
            <div id="p-place"></div>
          </div>
          <div class="ic-line"></div>
          <div class="ic-eyebrow" id="p-from" style="text-transform:none;letter-spacing:.02em"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="site-footer"></footer>

<script src="../assets/js/common.js"></script>
<script>
function render(){
  const g = id => document.getElementById(id).value;
  document.getElementById('p-eyebrow').textContent = g('f-eyebrow');
  document.getElementById('p-title').textContent = g('f-title');
  document.getElementById('p-body').textContent = g('f-body');
  document.getElementById('p-date').textContent = g('f-date');
  document.getElementById('p-place').textContent = g('f-place');
  document.getElementById('p-from').textContent = g('f-from');
}
document.body.addEventListener('input', render);
render();
initZoom('paper');
initThemePicker('theme-picker', '--inv-bg', 'paper');
initDownload('downloadBtn', 'Zaproszenie');
</script>
</body>
</html>
